<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rakshak AI — Staff Login</title>
<meta name="description" content="Secure staff login for Rakshak AI hospital and shelter management portal."/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="js/tailwind.config.js"></script>
<style>
  body { font-family: 'Inter', sans-serif; }

  .login-card {
    background: linear-gradient(145deg, rgba(30,30,40,0.98) 0%, rgba(20,20,30,0.98) 100%);
    border: 1px solid rgba(255,185,95,0.15);
    box-shadow: 0 0 80px rgba(255,185,95,0.05), 0 32px 64px rgba(0,0,0,0.6);
  }

  .input-field {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: #fff;
    font-size: 1.05rem;
    padding: 14px 18px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    min-height: 56px;
  }
  .input-field:focus {
    border-color: #ffb95f;
    box-shadow: 0 0 0 3px rgba(255,185,95,0.15);
  }
  .input-field::placeholder { color: rgba(255,255,255,0.3); }
  /* Fix browser autofill turning background white */
  .input-field:-webkit-autofill,
  .input-field:-webkit-autofill:hover,
  .input-field:-webkit-autofill:focus {
    -webkit-text-fill-color: #fff;
    -webkit-box-shadow: 0 0 0px 1000px rgba(25,25,35,0.98) inset;
    box-shadow: 0 0 0px 1000px rgba(25,25,35,0.98) inset;
    border-color: rgba(255,255,255,0.1);
    transition: background-color 9999s ease-in-out 0s;
  }

  .btn-login {
    width: 100%;
    min-height: 60px;
    background: linear-gradient(135deg, #ffb95f 0%, #f97316 100%);
    border: none;
    border-radius: 14px;
    color: #1a0e00;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 4px 20px rgba(255,185,95,0.3);
  }
  .btn-login:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
  .btn-login:active:not(:disabled) { transform: translateY(0); }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

  .bg-grid {
    background-image: linear-gradient(rgba(255,185,95,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,185,95,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .demo-pill {
    background: rgba(255,185,95,0.08);
    border: 1px solid rgba(255,185,95,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.6);
    font-family: 'JetBrains Mono', monospace;
  }
  .demo-pill strong { color: #ffb95f; }
</style>
</head>
<body class="min-h-screen bg-[#0d0d12] bg-grid flex flex-col items-center justify-center p-4">

  <!-- Back to public dashboard -->
  <a href="index.html" class="absolute top-6 left-6 flex items-center gap-2 text-sm text-white/40 hover:text-white/70 transition-colors">
    <span class="material-symbols-outlined text-[18px]">arrow_back</span>
    Public Dashboard
  </a>

  <!-- Card -->
  <div class="login-card w-full max-w-sm rounded-2xl p-8 relative">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-[#ffb95f]/10 border border-[#ffb95f]/30 flex items-center justify-center mb-4 shadow-lg">
        <span class="material-symbols-outlined text-[#ffb95f] text-4xl" style="font-variation-settings:'FILL' 1">shield</span>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">Staff Portal</h1>
      <p class="text-white/40 text-sm mt-1 text-center">Rakshak AI — Emergency Management</p>
    </div>

    <!-- Form -->
    <form onsubmit="adminLogin(event)" class="flex flex-col gap-4" autocomplete="on">
      <div>
        <label class="block text-xs font-semibold text-white/50 uppercase tracking-widest mb-2">Username</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/30 text-[20px]">person</span>
          <input
            id="username"
            type="text"
            class="input-field pl-12"
            placeholder="e.g. hospital1"
            autocomplete="username"
            required
          />
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-white/50 uppercase tracking-widest mb-2">Password</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/30 text-[20px]">lock</span>
          <input
            id="password"
            type="password"
            class="input-field pl-12"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <!-- Error message -->
      <div id="loginError" class="hidden bg-red-500/10 border border-red-500/30 rounded-xl px-4 py-3 text-red-400 text-sm text-center"></div>

      <button id="loginBtn" type="submit" class="btn-login mt-2">
        Sign In
      </button>
    </form>

    <!-- Demo credentials -->
    <div class="mt-6 space-y-2">
      <p class="text-xs text-white/30 text-center uppercase tracking-widest mb-3">Demo Credentials</p>
      <div class="demo-pill">
        <div class="flex justify-between"><span>Hospital staff</span><span><strong>hospital1</strong> / <strong>rakshak123</strong></span></div>
      </div>
      <div class="demo-pill">
        <div class="flex justify-between"><span>Shelter staff</span><span><strong>shelter1</strong> / <strong>rakshak123</strong></span></div>
      </div>
    </div>
  </div>

  <p class="mt-6 text-white/20 text-xs text-center">
    This portal is for authorized hospital and shelter personnel only.
  </p>

  <script src="js/admin.js"></script>
</body>
</html>
